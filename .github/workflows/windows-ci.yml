
name: Windows UCRT64 CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Configure, build, and test (UCRT64)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-whisper.cpp
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-rust

      - name: Configure fresh C++ build
        run: cmake -S . -B build -G Ninja

      - name: Build C++ application
        run: cmake --build build --parallel 2

      - name: Run C++ automated tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Test Rust voice service
        run: cargo test --manifest-path voice-service/Cargo.toml --locked

      - name: Build Rust voice service
        run: cargo build --release --manifest-path voice-service/Cargo.toml --locked
